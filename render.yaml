services:
  - type: web
    name: codeworld
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: bash start.sh
    envVars:
      - key: NODE_VERSION
        value: 22.0.0
      - key: NODE_ENV
        value: production
      - key: DB_BRIDGE_URL
        sync: false
      - key: BRIDGE_SECRET
        sync: false
      - key: CF_CLIENT_ID
        sync: false
      - key: CF_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: NEXT_PUBLIC_JUDGE0_API_URL
        sync: false
