services:
  - type: web
    name: codeworld
    runtime: node
    plan: free
    buildCommand: |
      npm install &&
      npm run build &&
      curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared &&
      chmod +x cloudflared
    startCommand: PATH=$PATH:$(pwd) bash start.sh
    envVars:
      - key: NODE_VERSION
        value: 22.0.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: NEXT_PUBLIC_JUDGE0_API_URL
        sync: false
      - key: CF_CLIENT_ID
        sync: false
      - key: CF_CLIENT_SECRET
        sync: false
      - key: CF_TUNNEL_HOSTNAME
        sync: false
